<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fictional 2050 future vision of the TU Delft Hortus Botanicus as The Green Heart of Technology." />
    <title>The Green Heart of Technology</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* ---------- References & AI statement ---------- */
      .info-button {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
        color: #0b1f14;
        background: #b9f5c8;
        border: 2px solid #ffffff;
        border-radius: 999px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35), 0 0 0 4px rgba(185, 245, 200, 0.25);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }
      .info-button:hover,
      .info-button:focus-visible {
        background: #d6ffe0;
        transform: translateY(-2px);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45), 0 0 0 5px rgba(185, 245, 200, 0.4);
        outline: none;
      }
      .info-button .info-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        font-size: 14px;
        font-weight: 700;
        color: #b9f5c8;
        background: #0b1f14;
        border-radius: 50%;
      }

      .info-overlay {
        position: fixed;
        inset: 0;
        z-index: 1100;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(5, 12, 9, 0.72);
        backdrop-filter: blur(4px);
      }
      .info-overlay.is-open {
        display: flex;
      }
      .info-modal {
        position: relative;
        width: 100%;
        max-width: 560px;
        max-height: 85vh;
        overflow-y: auto;
        padding: 32px 28px 28px;
        color: #eaf6ee;
        background: #0f261a;
        border: 1px solid rgba(185, 245, 200, 0.45);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      .info-modal h2 {
        margin: 0 0 18px;
        font-size: 22px;
        color: #b9f5c8;
      }
      .info-modal h3 {
        margin: 22px 0 8px;
        font-size: 16px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #b9f5c8;
      }
      .info-modal p,
      .info-modal li {
        margin: 0 0 10px;
        font-size: 15px;
        line-height: 1.6;
      }
      .info-modal ul {
        margin: 0;
        padding-left: 20px;
      }
      .info-modal a {
        color: #ffffff;
        text-decoration: underline;
        word-break: break-all;
      }
      .info-modal a:hover {
        color: #b9f5c8;
      }
      .info-close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
        font-size: 22px;
        line-height: 1;
        color: #eaf6ee;
        background: transparent;
        border: 1px solid rgba(185, 245, 200, 0.45);
        border-radius: 50%;
        cursor: pointer;
      }
      .info-close:hover,
      .info-close:focus-visible {
        background: rgba(185, 245, 200, 0.2);
        outline: none;
      }

      @media (max-width: 480px) {
        .info-button {
          right: 12px;
          bottom: 12px;
          padding: 11px 16px;
          font-size: 14px;
        }
        .info-modal {
          padding: 28px 20px 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="background-layer" aria-hidden="true"><div class="background-fallback"></div><img id="backgroundImage" alt="" /></div>
      <div id="world" class="world" aria-live="polite">
        <svg id="atmosphericNetwork" class="atmospheric-network" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="center-node" aria-label="The Green Heart of Technology"><div class="center-fallback" aria-hidden="true"></div><img id="centerImage" alt="The Green Heart of Technology" /></div>
        <div id="starsLayer" class="stars-layer" aria-label="The Green Heart of Technology star map"></div>
      </div>
      <footer class="site-footer" aria-label="City skyline footer"><div class="footer-image" aria-hidden="true"></div></footer>
    </div>

    <!-- References & AI statement -->
    <button type="button" id="infoButton" class="info-button" aria-haspopup="dialog" aria-controls="infoOverlay">
      <span class="info-icon" aria-hidden="true">i</span>
      References &amp; AI statement
    </button>

    <div id="infoOverlay" class="info-overlay" aria-hidden="true">
      <div class="info-modal" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
        <button type="button" id="infoClose" class="info-close" aria-label="Close">&times;</button>
        <h2 id="infoTitle">References &amp; AI statement</h2>

        <h3>References</h3>
        <ul>
          <li>
            <a href="https://www.tudelft.nl/hortus-botanicus" target="_blank" rel="noopener noreferrer">https://www.tudelft.nl/hortus-botanicus</a>
          </li>
        </ul>

        <h3>AI statement</h3>
        <p>
          We used generative AI from ChatGPT (OpenAI) and Claude (Anthropic) to make visuals (to give a futuristic impression), to write code and to improve text that we wrote ourselves.
        </p>
      </div>
    </div>

    <script src="images.js"></script><script src="script.js"></script>
    <script>
      (function () {
        var button = document.getElementById("infoButton");
        var overlay = document.getElementById("infoOverlay");
        var closeBtn = document.getElementById("infoClose");

        function openInfo() {
          overlay.classList.add("is-open");
          overlay.setAttribute("aria-hidden", "false");
          closeBtn.focus();
        }
        function closeInfo() {
          overlay.classList.remove("is-open");
          overlay.setAttribute("aria-hidden", "true");
          button.focus();
        }

        button.addEventListener("click", openInfo);
        closeBtn.addEventListener("click", closeInfo);
        overlay.addEventListener("click", function (e) {
          if (e.target === overlay) closeInfo();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && overlay.classList.contains("is-open")) closeInfo();
        });
      })();
    </script>
  </body>
</html>
