<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Width Image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }

    img {
      display: block;   /* removes the small gap under inline images */
      width: 100%;      /* fills the page from left to right */
      height: auto;     /* keeps the aspect ratio, so page height = image height */
    }
  </style>
</head>
<body>
  <img src="your-image.jpg" alt="Explore page">
</body>
</html>
